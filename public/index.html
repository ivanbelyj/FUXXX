<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <title>Messenger</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%2300ff41'%3EF%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!-- Тема и стиль выставляются до первой отрисовки (иначе на миг мерцает Matrix). -->
  <script src="/boot.js"></script>

  <!-- Экран входа: ноль порога, без аккаунтов. Ни строки состояния, ни подсказок —
       лого, случайный слоган поверх него, свои чаты и кнопка «создать» сверху. -->
  <main id="welcome" class="screen">
    <h1 class="logo">FUXXX<span>_</span><em class="slogan" id="slogan" aria-hidden="true"></em></h1>
    <!-- Мои чаты: кнопка создания всегда сверху секции. Сообщения не теряются,
         даже если вкладка была закрыта — история живёт на сервере. -->
    <section id="rooms" class="rooms">
      <button id="create" class="big" data-i18n="create">Создать чат</button>
      <!-- Имя спрашиваем только когда оно реально нужно — при создании чата. -->
      <form id="nameGate" class="name-gate hidden" autocomplete="off">
        <input id="name" maxlength="32" autocomplete="nickname" data-i18n-ph="namePlaceholder" placeholder="как тебя звать?">
        <button type="submit" data-i18n="save">Ок</button>
      </form>
      <div id="roomsList" class="hidden"></div>
    </section>
    <!-- Две оси визуала разведены явно: сначала СТИЛИ (материал), потом ТЕМЫ
         (цвета). Стиль не может изменить цвета, тема — не может изменить геометрию. -->
    <div class="switchers">
      <div class="sw-group">
        <span class="sw-label" data-i18n="labStyles">Styles</span>
        <nav class="themes" id="styles" data-i18n-aria="style" data-i18n-title="style" aria-label="Стиль"></nav>
      </div>
      <div class="sw-group">
        <span class="sw-label" data-i18n="labThemes">Themes</span>
        <nav class="themes" id="themes" data-i18n-aria="theme" data-i18n-title="theme" aria-label="Тема"></nav>
      </div>
      <div class="sw-group">
        <span class="sw-label" data-i18n="labLang">Lang</span>
        <nav class="themes" id="langs" data-i18n-aria="language" data-i18n-title="language" aria-label="Язык"></nav>
      </div>
    </div>
  </main>

  <!-- Экран чата -->
  <main id="chat" class="screen hidden">
    <header class="topbar">
      <button id="back" data-i18n-aria="back" data-i18n-title="back" aria-label="Назад" title="Назад">←</button>
      <div class="room">
        <strong id="roomname">…</strong>
        <small id="presence">—</small>
      </div>
      <button type="button" id="rename" data-i18n-aria="rename" data-i18n-title="rename" aria-label="Имя" title="Имя">✎</button>
      <button type="button" id="myavatar" data-i18n-aria="avatar" data-i18n-title="avatar" aria-label="Аватар" title="Аватар"><span class="ava" id="myava"></span></button>
      <input type="file" id="avatar" accept="image/*" hidden>
      <button id="share" data-i18n="share">Пригласить</button>
    </header>

    <!-- Имя меняется в любой момент: аккаунта нет, есть только подпись под сообщением. -->
    <form id="renameBox" class="rename hidden">
      <input id="renameInput" maxlength="32" autocomplete="nickname" data-i18n-ph="namePlaceholder" placeholder="как тебя звать?">
      <button type="submit" data-i18n="save">Ок</button>
    </form>

    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="typingLabel" class="typing"></div>

    <div id="pending" class="pending"></div>

    <form id="composer" class="composer">
      <button type="button" id="attach" data-i18n-aria="attach" data-i18n-title="attach" aria-label="Прикрепить" title="Прикрепить">+</button>
      <input type="file" id="file" accept="image/*,video/*" multiple hidden>
      <textarea id="text" rows="1" maxlength="4000" data-i18n-ph="composerPlaceholder" placeholder="Сообщение…  (@ai чтобы позвать ИИ)"></textarea>
      <button type="submit" id="send" data-i18n-aria="send" data-i18n-title="send" aria-label="Отправить" title="Отправить">→</button>
    </form>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
